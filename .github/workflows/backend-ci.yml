name: Backend CI & Release Gate

on:
  push:
    branches: [ main, 'phase-*', 'release/*', 'project/**' ]
  pull_request:
    branches: [ main, 'phase-*', 'release/*', 'project/**' ]

jobs:
  backend-test-and-build:
    name: Backend Test, Validate & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: playspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/playspace_test?schema=public
      DIRECT_URL: postgresql://test_user:test_password@localhost:5432/playspace_test?schema=public
      RESTORE_TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/playspace_restore_test?schema=public
      RETENTION_TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/playspace_retention_test?schema=public
      SUPABASE_URL: https://ci-isolated-test.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_mock_key_test_12345
      FRONTEND_URL: http://localhost:5173

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install Root & Server Dependencies
        run: |
          npm ci
          cd server && npm ci

      - name: Validate Environment Schema Pre-flight
        run: npm run env:validate --prefix server

      - name: Validate Prisma Schema
        run: npm run prisma:validate --prefix server

      - name: Generate Prisma Client
        run: npm run prisma:generate --prefix server

      - name: Pre-configure Supabase Roles in PostgreSQL
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U test_user -d playspace_test -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'anon') THEN
                CREATE ROLE anon NOLOGIN;
              END IF;
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'authenticated') THEN
                CREATE ROLE authenticated NOLOGIN;
              END IF;
            END
            \$\$;
          "

      - name: Deploy Migrations to Isolated Test Database
        run: |
          cd server && npx prisma migrate deploy

      - name: Create isolated restore target database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U test_user -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE playspace_restore_test;"

      - name: Deploy Migrations to Isolated Restore Database
        env:
          DATABASE_URL: ${{ env.RESTORE_TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.RESTORE_TEST_DATABASE_URL }}
        run: |
          cd server && npx prisma migrate deploy

      - name: Create isolated retention test database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U test_user -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE playspace_retention_test;"

      - name: Deploy Migrations to Isolated Retention Database
        env:
          DATABASE_URL: ${{ env.RETENTION_TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.RETENTION_TEST_DATABASE_URL }}
        run: |
          cd server && npx prisma migrate deploy

      - name: Security & Dependency Vulnerability Audit
        run: |
          npm audit --audit-level=high || true
          cd server && npm audit --audit-level=high || true

      - name: Backend Static Typecheck
        run: npm run typecheck --prefix server

      - name: Backend Lint Check
        run: npx oxlint server

      - name: Run Backend Automated Test Suite
        run: npm test --prefix server

      - name: Run retention integration against isolated PostgreSQL
        env:
          DATABASE_URL: ${{ env.RETENTION_TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.RETENTION_TEST_DATABASE_URL }}
          RUN_DATABASE_RETENTION_INTEGRATION: 'true'
        run: |
          cd server && npx vitest run tests/db_retention_integration.test.ts

      - name: Backend Production Build
        run: npm run build --prefix server
